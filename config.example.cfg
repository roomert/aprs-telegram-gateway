[telegram]
token = PLACE_TG_BOT_TOKEN_HERE

[aprs]
enabled = yes
# Callsign + passcode used to log in to APRS-IS
callsign = ZL2XXX-10
passcode = 12345
# The name people send APRS messages to (max 9 characters)
gateway_name = ZLTG
# Testing: run tools/fake_aprsis.py and leave these as-is
server = 127.0.0.1
port = 14580
# Safety switch. Only set to yes when you're ready for the real network
# (then use server = rotate.aprs2.net)
allow_live = no

beacon_lat = beacon_lat_in_degree_minutes #DDmm.mm S/N 
beacon_lon = beacon_lon_in_degree_minutes #DDDmm.mm E/W
beacon_comment = what_do_you_want_the_beacon_to_say
beacon_minutes = 120 #(2 hours in bewteen beacon events)
beacon_symbol_table = T
beacon_symbol = &

[registration]
database = registrations.db
code_minutes = 5
session_hours = 12
bot_username = YOUR_BOT_USERNAME_bot #(must have 'bot' at the end)
