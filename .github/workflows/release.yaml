name: Release builds

on:
  release:
    types: [published]      # runs when you click "Publish release"
  workflow_dispatch:        # also lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to attach files to the release

jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]    # ARM64 (Pi) and x64
    runs-on: ${{ matrix.runner }}
    container: python:3.11-bookworm                 # same glibc as Raspberry Pi OS Bookworm
    steps:
      - uses: actions/checkout@v4
      - run: sh ./build.sh
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: .\build.ps1
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*